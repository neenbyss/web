services:
  postgres:
    image: postgres:16-alpine
    container_name: nb-web-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: nbweb
      POSTGRES_PASSWORD: nbweb_dev
      POSTGRES_DB: nbweb
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
